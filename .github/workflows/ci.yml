name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: live module must ship disabled
        run: uv run python scripts/check_live_disabled.py config.yaml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy copybot/
      - run: uv run pytest --cov=copybot --cov-report=term-missing
